[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasapi-async"
dynamic = ["version"]
description = "Async-focused fork of CanvasAPI, a Python API wrapper for the Canvas LMS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Shippen", email = "tristan.shippen@gmail.com" }]
dependencies = [
    "anyio>=4.15.1",
    "arrow",
    "httpx>=0.28.1",
    "pytz",
    "requests",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/TShippen/canvasapi-async"
Repository = "https://github.com/TShippen/canvasapi-async"

[dependency-groups]
test = [
    "coverage",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests-mock",
    "respx>=0.23.1",
    "ruff",
]
dev = [
    { include-group = "test" },
    "pre-commit",
]

[tool.hatch.version]
path = "canvasapi_async/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["canvasapi_async"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Default rules (pyflakes + a subset of pycodestyle) plus import sorting,
# replacing the previous black + isort + flake8 toolchain, and the flake8-async
# rules that flag blocking calls inside async functions.
extend-select = ["ASYNC", "I"]

[tool.ruff.lint.isort]
known-first-party = ["canvasapi_async"]

[tool.mypy]
strict = true
# Modules are checked one at a time by path. Silent following still type-checks
# the imported inherited modules but reports no errors in them, so a run against
# a single annotated module is not buried under the unannotated package.
follow_imports = "silent"

[tool.coverage.run]
source = ["canvasapi_async"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
