[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasapi-async"
dynamic = ["version"]
description = "Async-focused fork of CanvasAPI, a Python API wrapper for the Canvas LMS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Shippen", email = "tristan.shippen@gmail.com" }]
dependencies = ["arrow", "pytz", "requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/TShippen/canvasapi-async"
Repository = "https://github.com/TShippen/canvasapi-async"

[dependency-groups]
test = [
    "coverage",
    "requests-mock",
    "ruff",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-version-warning",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "pre-commit",
]

[tool.hatch.version]
path = "canvasapi_async/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["canvasapi_async"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Default rules (pyflakes + a subset of pycodestyle) plus import sorting,
# replacing the previous black + isort + flake8 toolchain.
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["canvasapi_async"]

[tool.coverage.run]
source = ["canvasapi_async"]
