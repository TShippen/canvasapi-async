name: Checks

# Reports only. No branch protection rule or ruleset names these jobs as
# required, so a failure marks the commit without stopping a push or a merge.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Run the test suite under coverage
        run: uv run coverage run -m pytest

      - name: Report coverage
        run: uv run coverage report

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          # The Python 3.12 tests job has the same cache key and saves it, so a
          # save from this job would only log a conflict warning.
          save-cache: false

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github canvasapi_async tests

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run ruff format --check canvasapi_async tests

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          # The Python 3.12 tests job has the same cache key and saves it, so a
          # save from this job would only log a conflict warning.
          save-cache: false

      - name: Install the project
        run: uv sync --locked

      - name: Type check
        run: uv run mypy

  conventions:
    name: Source conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          # The Python 3.12 tests job has the same cache key and saves it, so a
          # save from this job would only log a conflict warning.
          save-cache: false

      - name: Install the project
        run: uv sync --locked

      - name: Every module is reachable from the package root
        run: uv run python scripts/find_missing_modules.py

      - name: Methods are in alphabetical order
        if: ${{ !cancelled() }}
        run: uv run python scripts/alphabetic.py

      - name: Public methods accept keyword arguments
        if: ${{ !cancelled() }}
        run: uv run python scripts/find_missing_kwargs.py
